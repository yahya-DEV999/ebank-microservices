server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: true
    gateway:
      # Routes vers les services enregistrés dans Eureka (load balancing avec lb://)
      routes:
        - id: r1
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**
        - id: r2
          uri: lb://EBANK-SERVICE
          predicates:
            - Path=/api/accounts/**
      # Routes dynamiques : http://localhost:8888/<nom-du-service>/...
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
